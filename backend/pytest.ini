[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 决策：保持 --cov-fail-under=40 不变。
# 项目 memory 硬约束要求 ≥80%，但全局门槛直接提到 80% 会触发既有不相关模块回归。
# Agent 模块（新增代码）通过子目录命令单独验证：
#   pytest tests/services/agent/ --cov=app.services.agent --cov-fail-under=80
# 这是新增代码的责任，不是全局回退。
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=40
filterwarnings =
    ignore::DeprecationWarning
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
